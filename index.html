<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пилатес">

<title>Учёт пилатеса</title>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky name + tabs, one toolbar per tab, cards and tables below; forms open as a sheet on top. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --surface-2: #e8eeec;
  --line: #d3dcd9;
  --line-soft: #e6ecea;
  --fg: #14211e;
  --muted: #586964;
  --accent: #1d6b66;
  --accent-ink: #14504c;
  --accent-fg: #ffffff;
  --accent-soft: #d6ebe8;
  --warn: #9a4f06;
  --warn-soft: #fbe8d0;
  --bad: #a8322a;
  --ok: #2b7550;
  --ok-soft: #d9efe3;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #2a9d6f;
  --s4: #8a5cd0;
  --shadow: 0 1px 2px rgba(20, 33, 30, .06), 0 8px 24px rgba(20, 33, 30, .08);
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1614; --surface: #16211f; --surface-2: #1d2b28; --line: #2c3d39; --line-soft: #233430;
    --fg: #e5eeeb; --muted: #94a69f; --accent: #5cbdb3; --accent-ink: #8fd9d0; --accent-fg: #082320; --accent-soft: #1b3834;
    --warn: #eaa862; --warn-soft: #382816; --bad: #f1897d; --ok: #72c99b; --ok-soft: #173126;
    --s1: #3987e5; --s2: #d95926; --s3: #3dba87; --s4: #a07be0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1614; --surface: #16211f; --surface-2: #1d2b28; --line: #2c3d39; --line-soft: #233430;
  --fg: #e5eeeb; --muted: #94a69f; --accent: #5cbdb3; --accent-ink: #8fd9d0; --accent-fg: #082320; --accent-soft: #1b3834;
  --warn: #eaa862; --warn-soft: #382816; --bad: #f1897d; --ok: #72c99b; --ok-soft: #173126;
  --s1: #3987e5; --s2: #d95926; --s3: #3dba87; --s4: #a07be0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--font-body); padding-inline: 16px; padding-block: 0 48px; }
.app { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 14px; border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 24px; letter-spacing: .01em; }
.brand .sub { color: var(--muted); font-size: 13px; }
.modebadge { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.modebadge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.modebadge.local::before { background: var(--warn); }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 16px 14px; }
.toolbar .spacer { flex: 1 1 auto; }
.monthnav { display: inline-flex; align-items: center; gap: 6px; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.iconbtn:hover { background: var(--surface-2); }
select, input[type="text"], input[type="number"], input[type="date"], input:not([type]), textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 34px; max-width: 100%;
}
select { padding-right: 6px; }
.check { display: inline-flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; min-height: 34px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.armed { background: var(--bad); color: var(--bg); }
.btn.small { padding: 3px 10px; min-height: 28px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--accent-ink); padding: 3px 6px; text-decoration: underline; text-underline-offset: 2px; }
.chips { display: inline-flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

/* banners */
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
.banner.note { background: var(--surface-2); border-color: var(--line); }

/* cards */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom: 14px; }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card.hero { border-color: var(--accent); box-shadow: var(--shadow); }
.card.dim { opacity: .62; }
.card h3 { font-size: 16px; }
.card .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
.card .row .who { display: flex; align-items: center; gap: 10px; }
.cnt { color: var(--muted); font-size: 12.5px; }
.big { font: 600 30px/1.1 var(--font-display); letter-spacing: .005em; }
.card.hero .big { font-size: clamp(36px, 7vw, 50px); }
.biglabel { color: var(--muted); font-size: 12.5px; margin: 2px 0 12px; }
.kv { display: grid; gap: 6px; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.muted { color: var(--muted); }
.curbadge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font: 600 14px var(--font-display); flex: none; }

/* sections and tables */
.sec { margin-top: 26px; }
.sec > h2 { font-size: 18px; margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.sec > h2 small { font: 400 13px var(--font-body); color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.unpaid td { background: var(--warn-soft); }
tr.total td { font-weight: 600; background: var(--surface-2); }
tr.gone td { color: var(--muted); }
.cell-sub { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
.pill.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pill.pause { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.paidtoggle { border-radius: 999px; padding: 2px 11px; font-size: 12.5px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 500; white-space: nowrap; }
.paidtoggle.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--fg); display: block; font: 600 17px var(--font-display); margin-bottom: 4px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.scale b { color: var(--fg); font-weight: 500; }
.rates { display: grid; gap: 14px; }
.rate { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
.rate:last-of-type { border-bottom: 0; }
.rate label { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
.rate .scale { grid-column: 1 / -1; margin: 0; }

/* chart */
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; }
.chartgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; }
.chartcell { min-width: 0; }
@media (max-width: 800px) { .chartgrid { grid-template-columns: minmax(0, 1fr); } }
.chartscroll { overflow-x: auto; }
.chartscroll svg { display: block; min-width: 560px; width: 100%; height: auto; }
.panelttl { font-weight: 600; font-size: 13.5px; margin: 14px 0 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 150px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 16, 14, .5); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 520px; padding: 20px 22px 18px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 20px; margin-bottom: 14px; }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
.form label.check { display: flex; font-size: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form label > input:not([type=checkbox]):not([type=radio]), .form label > select, .rate label > input, .rate label > select { width: 100%; min-width: 0; }
.form .two > label { min-width: 0; }
.withunit { width: 100%; }
.form .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.form .errmsg { color: var(--bad); font-size: 13px; min-height: 0; }
.withunit { display: flex; align-items: center; gap: 8px; }
.withunit input { flex: 1; min-width: 0; }
.withunit span { color: var(--muted); font-weight: 500; min-width: 18px; }
.pricebox { background: var(--surface-2); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; min-width: 46px; text-align: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 500; }
.seg input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg.cur span { font: 600 18px var(--font-display); min-width: 58px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.actions .left { margin-right: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
body.noscroll { overflow: hidden; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  .form .two { grid-template-columns: 1fr; }
  .brand h1 { font-size: 21px; }
  .sheet { padding: 18px 16px 16px; }
}
html { -webkit-text-size-adjust: 100%; }
button, select, .chip, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 700px) { input, select, textarea { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body><div class="app">
  <div class="top">
    <div class="head">
      <div class="brand"><h1>Учёт пилатеса</h1><span class="sub">реформер · мат · студия</span></div>
      <span id="mode" class="modebadge"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
  </div>
  <div id="banner"></div>
  <div id="toolbar" class="toolbar"></div>
  <main id="view"><div class="loading">Загружаю данные…</div></main>
</div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="impfile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
(function () {
  'use strict';

  /* ---------- константы и утилиты ---------- */
  var CUR = ['₸', '₽', '$'];
  var CURNAME = { '₸': 'Тенге', '₽': 'Рубли', '$': 'Доллары' };
  var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var MON3 = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var TYPES = ['Реформер', 'Мат'];
  var DIRS = ['Реформер', 'Мат', 'Оба'];
  var STATUSES = ['Активный', 'Пауза', 'Ушёл'];
  var TABS = [['summary', 'Сводка'], ['journal', 'Журнал'], ['clients', 'Клиенты'], ['studio', 'Студия'], ['months', 'По месяцам'], ['backup', 'Копия']];

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function dayNum(s) { var a = s.split('-'); return Math.round(Date.UTC(+a[0], +a[1] - 1, +a[2]) / 86400000); }
  function fmtDate(s) { if (!s) return ''; var a = s.split('-'); return a[2] + '.' + a[1] + '.' + a[0]; }
  function fmtDay(s) { var a = s.split('-'); var d = new Date(+a[0], +a[1] - 1, +a[2]); return WD[d.getDay()] + ' ' + a[2] + '.' + a[1] + '.' + a[0]; }
  function daysInMonth(m) { var a = m.split('-'); return new Date(+a[0], +a[1], 0).getDate(); }
  function plural(n, f) { var a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
  function numStr(n, max) { return (Math.round(n * 100) / 100).toLocaleString('ru-RU', { maximumFractionDigits: max == null ? 2 : max }); }
  function money(v, c) {
    var n = Number(v) || 0;
    if (c === '$') return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 });
    return numStr(n) + ' ' + (c || '');
  }
  function moneyDash(v, c) { return v ? money(v, c) : '<span class="muted">—</span>'; }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v) { if (v === '' || v == null) return null; var n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; }

  /* ---------- состояние ---------- */
  var S = { clients: {}, sessions: {}, studio: {}, studios: [], tab: 'summary', month: todayStr().slice(0, 7), year: new Date().getFullYear(),
    onlyUnpaid: false, fClient: '', fStatus: 'active', loaded: {}, mode: '', ready: false, rd: null };
  var DB = null;
  var busy = {};
  var LKEY = 'uchet-pilatesa-v1';

  try { var t0 = localStorage.getItem('uchet-pilatesa-tab'); if (t0 && TABS.some(function (t) { return t[0] === t0; })) S.tab = t0; } catch (e) { }

  var lastBackup = '';
  try { lastBackup = localStorage.getItem('uchet-pilatesa-backup') || ''; } catch (e) { }
  function loadLocal() {
    try {
      var j = JSON.parse(localStorage.getItem(LKEY) || 'null');
      if (j) { S.clients = j.clients || {}; S.sessions = j.sessions || {}; S.studio = j.studio || {}; S.studios = j.studios || []; }
    } catch (e) { }
  }
  function saveLocal() {
    try {
      localStorage.setItem(LKEY, JSON.stringify({ clients: S.clients, sessions: S.sessions, studio: S.studio, studios: S.studios }));
      S.saveFail = false;
      if (!S.persisted && navigator.storage && navigator.storage.persist) { S.persisted = true; try { navigator.storage.persist().catch(function () { }); } catch (e) { } }
    } catch (e) { if (!S.saveFail) { S.saveFail = true; toast('Не удалось сохранить на устройстве. Выгрузите копию в Excel.', 'bad'); } }
  }

  var raf = 0;
  function sched() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; render(); }); }

  function initData() { S.mode = 'local'; loadLocal(); S.ready = true; render(); }
  function put(coll, id, data) { S[coll][id] = data; saveLocal(); sched(); return Promise.resolve(true); }
  function del(coll, id) { delete S[coll][id]; saveLocal(); sched(); return Promise.resolve(true); }
  function putStudios(list) { S.studios = list; saveLocal(); sched(); return Promise.resolve(true); }

  var toastT = 0;
  function toast(msg, kind) {
    var el = $('#toast'); el.textContent = msg; el.className = 'toast' + (kind === 'bad' ? ' bad' : ''); el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3800);
  }

  /* ---------- производные данные ---------- */
  function clientList() {
    return Object.keys(S.clients).map(function (id) { var c = S.clients[id]; return Object.assign({ id: id }, c); })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); });
  }
  function sessionList() { return Object.keys(S.sessions).map(function (id) { return Object.assign({ id: id }, S.sessions[id]); }); }
  function studioList() { return Object.keys(S.studio).map(function (id) { return Object.assign({ id: id }, S.studio[id]); }); }
  function curOf(s) { var c = S.clients[s.clientId]; return c ? c.currency : ''; }
  function priceOf(s) {
    if (s.price != null && s.price !== '') return Number(s.price) || 0;
    var c = S.clients[s.clientId]; if (!c) return 0;
    return Number(s.type === 'Мат' ? c.priceM : c.priceR) || 0;
  }
  function studioTotal(t) { return (Number(t.rate) || 0) + (Number(t.adjust) || 0); }
  function rateFor(name, n) {
    var s = S.studios.filter(function (x) { return x.name === name; })[0];
    if (!s || !(n >= 1)) return 0;
    var cap = Math.max(1, Number(s.cap) || 1);
    return (Number(s.base) || 0) + (Number(s.step) || 0) * (Math.min(n, cap) - 1);
  }
  function emptyCur() { return { '₸': 0, '₽': 0, '$': 0 }; }
  function aggregate(list) {
    var out = {}; CUR.forEach(function (c) { out[c] = { n: 0, sum: 0, paid: 0 }; });
    list.forEach(function (s) { var c = curOf(s); if (!out[c]) return; var p = priceOf(s); out[c].n++; out[c].sum += p; if (s.paid) out[c].paid += p; });
    return out;
  }
  function sum(list, fn) { return list.reduce(function (a, x) { return a + fn(x); }, 0); }
  function hasDemo() {
    return ['clients', 'sessions', 'studio'].some(function (c) { return Object.keys(S[c]).some(function (k) { return S[c][k] && S[c][k].demo; }); });
  }

  /* ---------- общие куски разметки ---------- */
  function yearOptions() {
    var ys = {}; var cy = new Date().getFullYear();
    for (var y = cy - 2; y <= cy + 1; y++) ys[y] = 1;
    ys[S.year] = 1; ys[+S.month.slice(0, 4)] = 1;
    sessionList().forEach(function (s) { ys[+s.date.slice(0, 4)] = 1; });
    studioList().forEach(function (s) { ys[+s.date.slice(0, 4)] = 1; });
    return Object.keys(ys).map(Number).sort();
  }
  function monthNav() {

      '<select data-bind="year" aria-label="Год">' + yearOptions().map(function (y) { return '<option' + (y === a[0] ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +

    }

    h += '<div class="sec"><h2>По типам занятий <small>начислено</small></h2><div class="tablewrap"><table><thead><tr><th>Тип</th>' +
      CUR.map(function (c) { return '<th class="num">' + c + '</th>'; }).join('') + '<th class="num">Занятий</th></tr></thead><tbody>';

  }

        '<td><span class="pill ' + stc + '">' + esc(c.status) + '</span></td><td class="num">' + mine.length + '</td><td class="num">' + moneyDash(acc, c.currency) + '</td>' +
        '<td class="num ' + (debt > 0 ? 'warn' : '') + '">' + moneyDash(debt, c.currency) + '</td>' +

  function ratesHTML() {

  /* ---------- По месяцам ---------- */
  function monthRows(y) {
    var rows = [];
    for (var i = 0; i < 12; i++) rows.push({ n: 0, r: 0, m: 0, acc: emptyCur(), debt: emptyCur(), studio: 0 });
    sessionList().forEach(function (s) {
      if (s.date.indexOf(y + '-') !== 0) return;
      var row = rows[+s.date.slice(5, 7) - 1]; row.n++;
      if (s.type === 'Мат') row.m++; else row.r++;
      var c = curOf(s); if (c in row.acc) { var p = priceOf(s); row.acc[c] += p; if (!s.paid) row.debt[c] += p; }
    });
    studioList().forEach(function (t) { if (t.date.indexOf(y + '-') === 0) rows[+t.date.slice(5, 7) - 1].studio += studioTotal(t); });
    return rows;
  }
  function niceStep(x) { var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), r = x / p; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * p; }
  function compact(v) { return v >= 1e6 ? numStr(v / 1e6, 1) + ' млн' : v >= 1e3 ? numStr(v / 1e3, 1) + ' тыс' : String(v); }
  function barPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, h, w / 2));
    return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
  }
  var chartData = [];
  function panelSVG(pi, rows, title, series) {
    var data = rows.map(function (r, i) { return { label: MONTHS[i], parts: series.map(function (q) { return { name: q.name, v: q.get(r), cur: q.cur, color: q.color }; }) }; });
    chartData[pi] = { title: title, data: data };
    var W = 760, H = 210, L = 52, R = 10, T = 12, B = 28, iw = W - L - R, ih = H - T - B;
    var mx = Math.max(1, Math.max.apply(null, data.map(function (d) { return d.parts.reduce(function (s, q) { return s + q.v; }, 0); })));
    var step = niceStep(mx / 3), top = Math.ceil(mx / step) * step;
    var Y = function (v) { return T + ih - (v / top) * ih; };
    var slot = iw / 12, bw = Math.min(24, slot * 0.6), svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + title + ' по месяцам">';
    for (var v = 0; v <= top + 1e-9; v += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + compact(v) + '</text>';
    }
    data.forEach(function (d, i) {
      var x = L + slot * i + (slot - bw) / 2, acc = 0, used = d.parts.filter(function (q) { return q.v > 0; });
      used.forEach(function (q, k) {
        var hh = (q.v / top) * ih, y0 = Y(0) - acc - hh - (k ? 2 : 0);
        svg += '<path d="' + barPath(x, y0, bw, hh, k === used.length - 1 ? 4 : 0) + '" fill="' + q.color + '"/>';
        acc += hh + (k ? 2 : 0);
      });
      svg += '<text x="' + (L + slot * i + slot / 2) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + MON3[i] + '</text>';
      svg += '<rect class="hit" data-p="' + pi + '" data-i="' + i + '" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + ih + '" fill="transparent"/>';
    });
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="var(--muted)" stroke-width="1"/></svg>';
    return svg;
  }

  function viewMonths() {

    var h = '<div class="sec" style="margin-top:0"><h2>Доход по месяцам <small>у каждого графика свой масштаб, курс не используется</small></h2>' + chartHTML(rows) + '</div>';
    h += '<div class="sec"><h2>Все месяцы ' + y + ' <small>валюты не пересчитываются по курсу</small></h2><div class="tablewrap"><table style="min-width:900px"><thead><tr><th>Месяц</th><th class="num">Занятий</th><th class="num">Реф.</th><th class="num">Мат</th>' +

        CUR.map(function (c) { return '<td class="num">' + moneyDash(r.acc[c], c) + '</td>'; }).join('') +
        CUR.map(function (c) { return '<td class="num ' + (r.debt[c] > 0 ? 'warn' : '') + '">' + moneyDash(r.debt[c], c) + '</td>'; }).join('') +

      '<td class="num">' + moneyDash(tot.studio, '₸') + '</td></tr></tbody></table></div></div>';

  /* ---------- общий рендер ---------- */
  function render() {

    var banner = '';
    if (S.ready && needBackup() && !S.hideBackup) banner += '<div class="banner note"><span>' + (lastBackup ? 'Копию данных не делали больше двух недель.' : 'Копию данных ещё не делали.') + ' Сохраните файл Excel на случай, если что-то случится с телефоном.</span><span><button class="btn small" data-act="export">Выгрузить в Excel</button> <button class="btn small" data-act="hidebackup">Позже</button></span></div>';

    if (S.tab === 'summary') tb = monthNav();
    else if (S.tab === 'journal') tb = monthNav() + fc + '<label class="check"><input type="checkbox" data-bind="unpaid"' + (S.onlyUnpaid ? ' checked' : '') + '> Только неоплаченные</label><span class="spacer"></span><button class="btn primary" data-act="addsession">+ Занятие</button>';
    else if (S.tab === 'clients') tb = '<div class="chips"><button class="chip" data-act="fstatus" data-id="active" aria-pressed="' + (S.fStatus === 'active') + '">Активные</button><button class="chip" data-act="fstatus" data-id="all" aria-pressed="' + (S.fStatus === 'all') + '">Все</button></div><span class="spacer"></span><button class="btn primary" data-act="addclient">+ Клиент</button>';
    else if (S.tab === 'studio') tb = monthNav() + '<span class="spacer"></span><button class="btn primary" data-act="addstudio">+ Занятие в студии</button>';
    else if (S.tab === 'months') tb = yearNav();
    else tb = '';
    var tbEl = $('#toolbar');
    var active = document.activeElement && tbEl.contains(document.activeElement) ? document.activeElement.getAttribute('data-bind') : null;
    tbEl.innerHTML = tb;
    if (active) { var again = tbEl.querySelector('[data-bind="' + active + '"]'); if (again) again.focus(); }

    var view = $('#view');
    if (!S.ready) { view.innerHTML = '<div class="loading">Загружаю данные…</div>'; return; }
    var scrollers = Array.prototype.map.call(view.querySelectorAll('.tablewrap'), function (n) { return n.scrollLeft; });
    var focusRate = (document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-rate')) || null;
    view.innerHTML = S.tab === 'summary' ? viewSummary() : S.tab === 'journal' ? viewJournal() : S.tab === 'clients' ? viewClients() : S.tab === 'studio' ? viewStudio() : S.tab === 'backup' ? viewBackup() : viewMonths();
    Array.prototype.forEach.call(view.querySelectorAll('.tablewrap'), function (n, i) { if (scrollers[i]) n.scrollLeft = scrollers[i]; });
    if (focusRate) { var f = view.querySelector('[data-rate="' + focusRate + '"]'); if (f) f.focus(); }

  /* ---------- модальные формы ---------- */
  function openModal(html, onMount) {
    var el = $('#modal');
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    el.hidden = false; document.body.classList.add('noscroll');
    if (onMount) onMount(el);
    var f = el.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea'); if (f) f.focus();
  }
  function closeModal() { var el = $('#modal'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('noscroll'); }
  function armDelete(btn, run) {
    btn.addEventListener('click', function () {
      if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Точно удалить?'; setTimeout(function () { btn.classList.remove('armed'); btn.textContent = 'Удалить'; }, 4000); return; }
      run();
    });
  }
  function defaultDate() { var t = todayStr(); return t.indexOf(S.month) === 0 ? t : S.month + '-01'; }

  /* ---------- действия ---------- */
  function clearDemo() {
    var jobs = [];
    var demoClients = {};
    Object.keys(S.clients).forEach(function (k) { if (S.clients[k] && S.clients[k].demo) demoClients[k] = 1; });
    ['clients', 'sessions', 'studio'].forEach(function (c) {
      Object.keys(S[c]).forEach(function (k) {
        var d = S[c][k];
        if (d && (d.demo || (c === 'sessions' && demoClients[d.clientId]))) jobs.push([c, k]);
      });
    });
    var i = 0;
    (function next() {
      if (i >= jobs.length) { toast('Примеры удалены'); return; }
      var j = jobs[i++]; del(j[0], j[1]).then(function (ok) { if (ok) next(); });

    if (typeof v === 'number') { var d = new Date((Math.round(v) - 25569) * 86400000); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
    var s = String(v).trim(), a = /^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/.exec(s);
    if (a) return a[3] + '-' + p2(+a[2]) + '-' + p2(+a[1]);
    a = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    return a ? a[1] + '-' + p2(+a[2]) + '-' + p2(+a[3]) : '';
  }
  function vBool(v) { if (typeof v === 'boolean') return v; var s = String(v == null ? '' : v).trim().toLowerCase(); return s === 'да' || s === 'yes' || s === 'true' || s === '1'; }
  function vCur(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '₸' || s === 'тенге' || s === 'kzt' || s === 'тг') return '₸';
    if (s === '₽' || s === 'рубли' || s === 'руб' || s === 'rub' || s === 'р') return '₽';
    if (s === '$' || s === 'доллары' || s === 'usd' || s === 'долл') return '$';
    return '';
  }
  function vOne(v, list, dflt) { var s = String(v == null ? '' : v).trim().toLowerCase(); for (var i = 0; i < list.length; i++) if (list[i].toLowerCase() === s) return list[i]; return dflt; }

  function parseBackup(book) {
    var sc = book['Клиенты'], sj = book['Журнал'];
    if (!sc || !sj) throw new Error('nosheets');
    var out = { clients: {}, sessions: {}, studio: {}, studios: [], skipped: 0, stamp: Date.now().toString(36) }, byName = {}, n = 0;
    var cm = colMap(sc[0]);
    if (cm['имя'] == null) throw new Error('nosheets');
    for (var r = 1; r < sc.length; r++) {
      var row = sc[r] || [], name = vText(row[cm['имя']]); if (!name) continue;
      if (byName[name.toLowerCase()]) { out.skipped++; continue; }
      var id = 'i' + out.stamp + (n++);
      out.clients[id] = { name: name, contact: vText(row[cm['контакт']]), direction: vOne(row[cm['направление']], DIRS, 'Оба'), currency: vCur(row[cm['валюта']]) || '₸',
        priceR: vNum(row[cm['цена реформер']]), priceM: vNum(row[cm['цена мат']]), status: vOne(row[cm['статус']], STATUSES, 'Активный'), start: vDate(row[cm['дата начала']]), notes: vText(row[cm['заметки']]) };
      byName[name.toLowerCase()] = id;
    }
    var jm = colMap(sj[0]);
    for (r = 1; r < sj.length; r++) {
      row = sj[r] || [];
      var date = vDate(row[jm['дата']]), cid = byName[vText(row[jm['клиент']]).toLowerCase()], type = vOne(row[jm['тип']], TYPES, '');
      if (!date && !vText(row[jm['клиент']])) continue;
      if (!date || !cid || !type) { out.skipped++; continue; }
      var cl = out.clients[cid], card = type === 'Мат' ? cl.priceM : cl.priceR, price = vNum(row[jm['цена']]);
      var over = (price != null && (card == null || Math.abs(price - card) > 1e-9)) ? price : null;
      var paid = vBool(row[jm['оплачено']]);
      out.sessions['j' + out.stamp + (n++)] = { date: date, clientId: cid, type: type, price: over, paid: paid, paidDate: paid ? (vDate(row[jm['дата оплаты']]) || date) : '', note: vText(row[jm['заметка']]) };
    }
    var rm = colMap((book['Условия студий'] || [])[0]), rr = book['Условия студий'] || [];
    for (r = 1; r < rr.length; r++) {
      row = rr[r] || []; var sn = vText(row[rm['студия']]); if (!sn) continue;
      out.studios.push({ name: sn, base: vNum(row[rm['за 1 участника']]) || 0, step: vNum(row[rm['плюс за каждого следующего']]) || 0, cap: Math.max(1, Math.min(6, Math.round(vNum(row[rm['растет до чел']]) || 4))) });
    }
    var tt = book['Студия'] || [], tm = colMap(tt[0]);
    for (r = 1; r < tt.length; r++) {
      row = tt[r] || [];
      var td = vDate(row[tm['дата']]), tn = Math.round(vNum(row[tm['участников']]) || 0), tname = vText(row[tm['студия']]), ttype = vOne(row[tm['тип']], TYPES, '');
      if (!td && !tname) continue;
      if (!td || !tname || !ttype || tn < 1 || tn > 6) { out.skipped++; continue; }
      var rate = vNum(row[tm['ставка']]);
      if (rate == null) { var cfg = out.studios.filter(function (z) { return z.name === tname; })[0]; rate = cfg ? cfg.base + cfg.step * (Math.min(tn, cfg.cap) - 1) : 0; }
      out.studio['t' + out.stamp + (n++)] = { date: td, studio: tname, type: ttype, n: tn, rate: rate, adjust: vNum(row[tm['корректировка']]) || 0, paid: vBool(row[tm['выплачено']]), note: vText(row[tm['заметка']]) };
    }
    return out;
  }
  function importFile(f) {
    f.arrayBuffer().then(unzip).then(readBook).then(parseBackup).then(function (p) { confirmImport(p, f.name); }).catch(function (e) {
      toast(e && e.message === 'nodecomp' ? 'Этот браузер не умеет читать такие файлы Excel. Обновите систему или загрузите файл, выгруженный из этого приложения.' : 'Не удалось прочитать файл. Нужен файл .xlsx, который выгрузило это приложение.', 'bad');
    });
  }
  function confirmImport(p, fname) {
    var cnt = function (o) { return Object.keys(o).length; };
    var html = '<h2>Загрузить копию?</h2><p style="margin:0 0 8px">Файл «' + esc(fname) + '»: клиентов — <b>' + cnt(p.clients) + '</b>, занятий — <b>' + cnt(p.sessions) + '</b>, занятий в студии — <b>' + cnt(p.studio) + '</b>.</p>' +
      '<p style="margin:0 0 8px">Сейчас в приложении: клиентов — ' + cnt(S.clients) + ', занятий — ' + cnt(S.sessions) + ', в студии — ' + cnt(S.studio) + '. Эти данные будут <b>заменены</b> данными из файла.</p>' +
      (p.skipped ? '<p class="warn" style="margin:0 0 8px">Пропущено строк с ошибками: ' + p.skipped + ' (нет клиента, даты или типа занятия).</p>' : '') +
      '<div class="actions"><button type="button" class="btn left" data-act="export">Сначала выгрузить текущие данные</button><button type="button" class="btn" data-act="close">Отмена</button><button type="button" class="btn primary" id="doimport">Заменить данные</button></div>';
    openModal(html, function (el) {
      el.querySelector('#doimport').addEventListener('click', function () {
        S.clients = p.clients; S.sessions = p.sessions; S.studio = p.studio; if (p.studios.length || !S.studios.length) S.studios = p.studios; S.rd = null;
        saveLocal(); closeModal(); render(); toast('Данные загружены из файла');
      });
    });
  }

  /* ---------- пробные данные, пустой старт, стирание ---------- */
  function hasAnyData() { return Object.keys(S.clients).length || Object.keys(S.sessions).length || Object.keys(S.studio).length; }
  function hasReal() { return ['clients', 'sessions', 'studio'].some(function (c) { return Object.keys(S[c]).some(function (k) { return !S[c][k].demo; }); }); }
  function needBackup() { return hasReal() && (!lastBackup || dayNum(todayStr()) - dayNum(lastBackup) > 14); }
  function ago(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function seedDemo() {
    var cl = [['c1', 'Айгерим', '@aigerim', 'Оба', '₸', 8000, 5000, 'Ходит 2 раза в неделю'], ['c2', 'Мария', '+7 700 000 00 01', 'Реформер', '₸', 9000, null, ''],
      ['c3', 'Динара', '@dinara', 'Мат', '₽', null, 1800, 'Нерегулярно'], ['c4', 'Елена', '@elena', 'Оба', '$', 15, 10, ''], ['c5', 'Асель', '@asel', 'Реформер', '₸', 8000, null, 'Давно не была']];
    cl.forEach(function (x) { S.clients['demo-' + x[0]] = { name: x[1], contact: x[2], direction: x[3], currency: x[4], priceR: x[5], priceM: x[6], status: 'Активный', start: ago(45), notes: x[7], demo: true }; });
    var se = [['c1', 'Реформер', 28, 1], ['c2', 'Реформер', 27, 1], ['c3', 'Мат', 26, 1], ['c4', 'Мат', 25, 1], ['c1', 'Мат', 21, 1], ['c2', 'Реформер', 20, 1], ['c4', 'Реформер', 18, 1], ['c5', 'Реформер', 17, 1],
      ['c1', 'Реформер', 14, 1], ['c2', 'Реформер', 13, 1], ['c3', 'Мат', 11, 1], ['c1', 'Реформер', 8, 1], ['c2', 'Реформер', 7, 1], ['c3', 'Мат', 5, 0], ['c4', 'Мат', 4, 0], ['c1', 'Мат', 3, 1], ['c2', 'Реформер', 1, 0]];
    se.forEach(function (x, i) { S.sessions['demo-s' + i] = { date: ago(x[2]), clientId: 'demo-' + x[0], type: x[1], price: null, paid: !!x[3], paidDate: x[3] ? ago(x[2]) : '', note: '', demo: true }; });
    if (!S.studios.length) S.studios = [{ name: 'Моя студия', base: 5500, step: 1000, cap: 4 }];
    var ts = [[15, 'Мат', 6, 1], [13, 'Реформер', 4, 1], [9, 'Реформер', 2, 1], [6, 'Мат', 5, 1], [3, 'Реформер', 1, 1], [1, 'Реформер', 3, 0]];
    ts.forEach(function (x, i) { S.studio['demo-t' + i] = { date: ago(x[0]), studio: S.studios[0].name, type: x[1], n: x[2], rate: rateFor(S.studios[0].name, x[2]), adjust: 0, paid: !!x[3], note: '', demo: true }; });
    S.month = todayStr().slice(0, 7); saveLocal(); render();
  }
  function welcomeHTML() {
    return '<div class="empty" style="padding:44px 22px"><b style="font-size:22px">Здесь пока пусто</b>Начните с клиента: укажите его валюту и цену за занятие. Дальше занятия записываются в пару нажатий.' +
      '<div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" data-act="startclient">+ Добавить клиента</button><button class="btn" data-act="seed">Посмотреть на примерах</button><button class="btn" data-act="import">Загрузить копию из Excel</button></div></div>';
  }
  function viewBackup() {
    var cnt = function (o) { return Object.keys(o).length; };
    var last = lastBackup ? fmtDate(lastBackup) + ' (' + (dayNum(todayStr()) - dayNum(lastBackup)) + ' ' + plural(dayNum(todayStr()) - dayNum(lastBackup), ['день', 'дня', 'дней']) + ' назад)' : 'ещё не делали';
    return '<div class="grid two">' +
      '<section class="card"><div class="row"><h3>Сохранить копию</h3></div><p style="margin:0 0 12px">В файл Excel попадут клиенты, журнал занятий, занятия в студии и условия оплаты. Последняя копия: <b>' + last + '</b>.</p>' +
      '<dl class="kv" style="margin-bottom:14px"><div><dt>Клиентов</dt><dd>' + cnt(S.clients) + '</dd></div><div><dt>Занятий</dt><dd>' + cnt(S.sessions) + '</dd></div><div><dt>Занятий в студии</dt><dd>' + cnt(S.studio) + '</dd></div></dl>' +
      '<button class="btn primary" data-act="export">Выгрузить в Excel</button></section>' +
      '<section class="card"><div class="row"><h3>Восстановить из копии</h3></div><p style="margin:0 0 14px">Выберите файл .xlsx, который выгрузило это приложение. Данные в приложении будут заменены данными из файла. Файл можно править в Excel, колонки менять не нужно.</p>' +
      '<button class="btn" data-act="import">Загрузить из Excel</button></section></div>' +
      '<div class="sec" style="margin-top:6px"><h2>Как хранятся данные</h2><div class="card"><p style="margin:0 0 10px">Записи лежат только на этом устройстве, в памяти браузера. В интернет они не отправляются и на другие устройства не попадают.</p>' +
      '<p style="margin:0 0 10px"><b>Сохраняйте копию раз в одну-две недели</b> и не стирайте данные сайтов в настройках Safari: вместе с ними пропадут и записи.</p>' +
      '<p style="margin:0">На iPhone откройте адрес приложения в Safari, нажмите «Поделиться» и «На экран “Домой”». Вводите данные уже в приложении с иконки: у иконки и у Safari память раздельная, записи из одной не видны в другой. Если вводили данные в Safari, выгрузите копию там и загрузите её в приложении с иконки.</p></div></div>' +
      '<div class="sec"><h2>Стереть все данные</h2><div class="card"><p style="margin:0 0 12px">Удалит всех клиентов, занятия и условия студий на этом устройстве. Сначала сделайте копию.</p><button class="btn danger" data-act="wipe">Стереть всё…</button></div></div>';
  }
  function openWipe() {
    openModal('<h2>Стереть все данные?</h2><p style="margin:0 0 8px">Будут удалены все клиенты, занятия и условия студий на этом устройстве. Это нельзя отменить, если нет копии в Excel.</p>' +
      '<div class="actions"><button type="button" class="btn left" data-act="export">Сначала выгрузить копию</button><button type="button" class="btn" data-act="close">Отмена</button><button type="button" class="btn danger" id="dowipe">Стереть всё</button></div>', function (el) {
      var b = el.querySelector('#dowipe');
      b.addEventListener('click', function () {
        if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Точно стереть?'; return; }
        S.clients = {}; S.sessions = {}; S.studio = {}; S.studios = []; S.rd = null; saveLocal(); closeModal(); S.tab = 'summary'; render(); toast('Все данные стёрты');
      });
    });
  }

  $('#impfile').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) importFile(f); });
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { } }); }

  render();
  initData();
})();
</script>
</body>
</html>
