<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0e1614" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky name + tabs, one toolbar per tab, cards and tables below; forms open as a sheet on top. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --surface-2: #e8eeec;
  --line: #d3dcd9;
  --line-soft: #e6ecea;
  --fg: #14211e;
  --muted: #586964;
  --accent: #1d6b66;
  --accent-ink: #14504c;
  --accent-fg: #ffffff;
  --accent-soft: #d6ebe8;
  --warn: #9a4f06;
  --warn-soft: #fbe8d0;
  --bad: #a8322a;
  --bad-soft: #f8dcd8;
  --ok: #2b7550;
  --ok-soft: #d9efe3;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #2a9d6f;
  --s4: #8a5cd0;
  --s5: #c98a0a;
  --shadow: 0 1px 2px rgba(20, 33, 30, .06), 0 8px 24px rgba(20, 33, 30, .08);
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1614; --surface: #16211f; --surface-2: #1d2b28; --line: #2c3d39; --line-soft: #233430;
    --fg: #e5eeeb; --muted: #94a69f; --accent: #5cbdb3; --accent-ink: #8fd9d0; --accent-fg: #082320; --accent-soft: #1b3834;
    --warn: #eaa862; --warn-soft: #382816; --bad: #f1897d; --bad-soft: #3a1c19; --ok: #72c99b; --ok-soft: #173126;
    --s1: #3987e5; --s2: #d95926; --s3: #3dba87; --s4: #a07be0; --s5: #e0b341;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1614; --surface: #16211f; --surface-2: #1d2b28; --line: #2c3d39; --line-soft: #233430;
  --fg: #e5eeeb; --muted: #94a69f; --accent: #5cbdb3; --accent-ink: #8fd9d0; --accent-fg: #082320; --accent-soft: #1b3834;
  --warn: #eaa862; --warn-soft: #382816; --bad: #f1897d; --bad-soft: #3a1c19; --ok: #72c99b; --ok-soft: #173126;
  --s1: #3987e5; --s2: #d95926; --s3: #3dba87; --s4: #a07be0; --s5: #e0b341;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--font-body); padding-inline: 16px; padding-block: 0 48px; }
.app { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 14px; border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 24px; letter-spacing: .01em; }
.brand .sub { color: var(--muted); font-size: 13px; }
.modebadge { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.modebadge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.modebadge.local::before { background: var(--warn); }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 16px 14px; }
.toolbar .spacer { flex: 1 1 auto; }
.monthnav { display: inline-flex; align-items: center; gap: 6px; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.iconbtn:hover { background: var(--surface-2); }
select, input[type="text"], input[type="number"], input[type="date"], input:not([type]), textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 34px; max-width: 100%;
}
select { padding-right: 6px; }
.check { display: inline-flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; min-height: 34px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.armed { background: var(--bad); color: var(--bg); }
.btn.small { padding: 3px 10px; min-height: 28px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--accent-ink); padding: 3px 6px; text-decoration: underline; text-underline-offset: 2px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

/* banners */
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
.banner.note { background: var(--surface-2); border-color: var(--line); }

/* cards */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom: 14px; }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card.hero { border-color: var(--accent); box-shadow: var(--shadow); }
.card.dim { opacity: .62; }
.card h3 { font-size: 16px; }
.card .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
.card .row .who { display: flex; align-items: center; gap: 10px; }
.cnt { color: var(--muted); font-size: 12.5px; }
.big { font: 600 30px/1.1 var(--font-display); letter-spacing: .005em; }
.card.hero .big { font-size: clamp(36px, 7vw, 50px); }
.biglabel { color: var(--muted); font-size: 12.5px; margin: 2px 0 12px; }
.kv { display: grid; gap: 6px; margin: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.muted { color: var(--muted); }
.curbadge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font: 600 14px var(--font-display); flex: none; }

/* sections and tables */
.sec { margin-top: 26px; }
.sec > h2 { font-size: 18px; margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.sec > h2 small { font: 400 13px var(--font-body); color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.unpaid td { background: var(--warn-soft); }
tr.total td { font-weight: 600; background: var(--surface-2); }
tr.gone td { color: var(--muted); }
.cell-sub { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
.pill.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pill.pause { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pill.soon { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pill.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.pill.free { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
tr.exp td { background: var(--bad-soft); }
tr.soonrow td { background: var(--warn-soft); }
.statrow { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 2px 0 14px; }
.statrow span { color: var(--muted); }
.statrow b { font: 600 22px var(--font-display); color: var(--fg); margin-right: 6px; }
.statrow .warn b { color: var(--warn); }
.statrow .bad b { color: var(--bad); }
.lbl { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
.hist { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.hrow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
.hrow:last-child { border-bottom: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-bottom: 10px; }
.mrow .mfix { grid-column: 1 / -1; display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.mrow select, .mrow input { min-width: 0; width: 100%; }
.attrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.attrow .amt { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.attrow .paidc { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
[hidden] { display: none !important; }
.paidtoggle { border-radius: 999px; padding: 2px 11px; font-size: 12.5px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 500; white-space: nowrap; }
.paidtoggle.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--fg); display: block; font: 600 17px var(--font-display); margin-bottom: 4px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.scale b { color: var(--fg); font-weight: 500; }
.rates { display: grid; gap: 14px; }
.rate { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
.rate:last-of-type { border-bottom: 0; }
.rate label { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
.rate .scale { grid-column: 1 / -1; margin: 0; }

/* chart */
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; }
.chartgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; }
.chartcell { min-width: 0; }
@media (max-width: 800px) { .chartgrid { grid-template-columns: minmax(0, 1fr); } }
.chartscroll { overflow-x: auto; }
.chartscroll svg { display: block; min-width: 560px; width: 100%; height: auto; }
.panelttl { font-weight: 600; font-size: 13.5px; margin: 14px 0 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 150px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 16, 14, .5); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 520px; padding: 20px 22px 18px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 20px; margin-bottom: 14px; }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
.form label.check { display: flex; font-size: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form label > input:not([type=checkbox]):not([type=radio]), .form label > select, .rate label > input, .rate label > select { width: 100%; min-width: 0; }
.form .two > label { min-width: 0; }
.withunit { width: 100%; }
.form .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.form .errmsg { color: var(--bad); font-size: 13px; min-height: 0; }
.withunit { display: flex; align-items: center; gap: 8px; }
.withunit input { flex: 1; min-width: 0; }
.withunit span { color: var(--muted); font-weight: 500; min-width: 18px; }
.pricebox { background: var(--surface-2); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; min-width: 46px; text-align: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 500; }
.seg input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg.cur span { font: 600 18px var(--font-display); min-width: 58px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.actions .left { margin-right: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
body.noscroll { overflow: hidden; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  .form .two { grid-template-columns: 1fr; }
  .brand h1 { font-size: 21px; }
  .sheet { padding: 18px 16px 16px; }
}
html { -webkit-text-size-adjust: 100%; }
button, select, .chip, .tab { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 700px) { input, select, textarea { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body><div class="app">
  <div class="top">
    <div class="head">
      <div class="brand"><h1>Учёт пилатеса</h1><span class="sub">реформер · мат · студия</span></div>
      <span id="mode" class="modebadge"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
  </div>
  <div id="banner"></div>
  <div id="toolbar" class="toolbar"></div>
  <main id="view"><div class="loading">Загружаю данные…</div></main>
</div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="impfile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
(function () {
  'use strict';

  /* ---------- константы и утилиты ---------- */
  var CUR = ['₸', '₽', '$'];
  var CURNAME = { '₸': 'Тенге', '₽': 'Рубли', '$': 'Доллары' };
  var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var MON3 = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var TYPES = ['Реформер', 'Мат'];
  var DIRS = ['Реформер', 'Мат', 'Оба'];
  var STATUSES = ['Активный', 'Пауза', 'Ушёл'];
  var TABS = [['summary', 'Сводка'], ['journal', 'Журнал'], ['clients', 'Клиенты'], ['groups', 'Мини-группы'], ['studio', 'Студия'], ['online', 'Онлайн-группа'], ['months', 'По месяцам'], ['backup', 'Копия']];

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function dayNum(s) { var a = s.split('-'); return Math.round(Date.UTC(+a[0], +a[1] - 1, +a[2]) / 86400000); }

  function fmtDay(s) { var a = s.split('-'); var d = new Date(+a[0], +a[1] - 1, +a[2]); return WD[d.getDay()] + ' ' + a[2] + '.' + a[1] + '.' + a[0]; }
  function daysInMonth(m) { var a = m.split('-'); return new Date(+a[0], +a[1], 0).getDate(); }
  function plural(n, f) { var a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
  function numStr(n, max) { return (Math.round(n * 100) / 100).toLocaleString('ru-RU', { maximumFractionDigits: max == null ? 2 : max }); }
  function money(v, c) {
    var n = Number(v) || 0;
    if (c === '$') return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 });
    return numStr(n) + ' ' + (c || '');
  }
  function moneyDash(v, c) { return v ? money(v, c) : '<span class="muted">—</span>'; }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v) { if (v === '' || v == null) return null; var n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; }

  /* ---------- состояние ---------- */
  var S = { clients: {}, sessions: {}, studio: {}, studios: [], members: {}, subs: {}, groups: {}, fMember: 'all', tab: 'summary', month: todayStr().slice(0, 7), year: new Date().getFullYear(),
    onlyUnpaid: false, fClient: '', fStatus: 'active', loaded: {}, mode: '', ready: false, rd: null };
  var DB = null;
  var busy = {};
  var LKEY = 'uchet-pilatesa-v1';

  try { var t0 = localStorage.getItem('uchet-pilatesa-tab'); if (t0 && TABS.some(function (t) { return t[0] === t0; })) S.tab = t0; } catch (e) { }

  var lastBackup = '';
  try { lastBackup = localStorage.getItem('uchet-pilatesa-backup') || ''; } catch (e) { }
  function loadLocal() {
    try {
      var j = JSON.parse(localStorage.getItem(LKEY) || 'null');
      if (j) { S.clients = j.clients || {}; S.sessions = j.sessions || {}; S.studio = j.studio || {}; S.studios = j.studios || []; S.members = j.members || {}; S.subs = j.subs || {}; S.groups = j.groups || {}; }
    } catch (e) { }
  }
  function saveLocal() {
    try {
      localStorage.setItem(LKEY, JSON.stringify({ clients: S.clients, sessions: S.sessions, studio: S.studio, studios: S.studios, members: S.members, subs: S.subs, groups: S.groups }));
      S.saveFail = false;
      if (!S.persisted && navigator.storage && navigator.storage.persist) { S.persisted = true; try { navigator.storage.persist().catch(function () { }); } catch (e) { } }
    } catch (e) { if (!S.saveFail) { S.saveFail = true; toast('Не удалось сохранить на устройстве. Выгрузите копию в Excel.', 'bad'); } }
  }

  var raf = 0;
  function sched() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; render(); }); }

  function initData() { S.mode = 'local'; loadLocal(); S.ready = true; render(); }
  function put(coll, id, data) { S[coll][id] = data; saveLocal(); sched(); return Promise.resolve(true); }
  function del(coll, id) { delete S[coll][id]; saveLocal(); sched(); return Promise.resolve(true); }
  function putStudios(list) { S.studios = list; saveLocal(); sched(); return Promise.resolve(true); }

  var toastT = 0;
  function toast(msg, kind) {
    var el = $('#toast'); el.textContent = msg; el.className = 'toast' + (kind === 'bad' ? ' bad' : ''); el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3800);
  }

  /* ---------- производные данные ---------- */
  function clientList() {
    return Object.keys(S.clients).map(function (id) { var c = S.clients[id]; return Object.assign({ id: id }, c); })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); });
  }
  function sessionList() { return Object.keys(S.sessions).map(function (id) { return Object.assign({ id: id }, S.sessions[id]); }); }
  function studioList() { return Object.keys(S.studio).map(function (id) { return Object.assign({ id: id }, S.studio[id]); }); }
  function curOf(s) { if (s.cur) return s.cur; var c = S.clients[s.clientId]; return c ? c.currency : ''; }
  function priceOf(s) {
    if (s.price != null && s.price !== '') return Number(s.price) || 0;
    var c = S.clients[s.clientId]; if (!c) return 0;
    return Number(s.type === 'Мат' ? c.priceM : c.priceR) || 0;
  }
  function studioTotal(t) { return (Number(t.rate) || 0) + (Number(t.adjust) || 0); }
  function rateFor(name, n) {
    var s = S.studios.filter(function (x) { return x.name === name; })[0];
    if (!s || !(n >= 1)) return 0;
    var cap = Math.max(1, Number(s.cap) || 1);
    return (Number(s.base) || 0) + (Number(s.step) || 0) * (Math.min(n, cap) - 1);
  }
  function emptyCur() { return { '₸': 0, '₽': 0, '$': 0 }; }
  function units(list) { var seen = {}, n = 0; list.forEach(function (s) { if (s.gsid) { if (!seen[s.gsid]) { seen[s.gsid] = 1; n++; } } else n++; }); return n; }
  function aggregate(list) {
    var out = {}, by = {}; CUR.forEach(function (c) { out[c] = { n: 0, sum: 0, paid: 0 }; by[c] = []; });
    list.forEach(function (s) { var c = curOf(s); if (!out[c]) return; var p = priceOf(s); by[c].push(s); out[c].sum += p; if (s.paid) out[c].paid += p; });
    CUR.forEach(function (c) { out[c].n = units(by[c]); });
    return out;
  }
  function sumByCur(list, fn) { var o = emptyCur(); list.forEach(function (s) { var c = curOf(s); if (c in o) o[c] += fn(s); }); return o; }
  function multiMoney(o) { var p = CUR.filter(function (c) { return o[c]; }).map(function (c) { return money(o[c], c); }); return p.length ? p.join(' + ') : '<span class="muted">—</span>'; }
  function sum(list, fn) { return list.reduce(function (a, x) { return a + fn(x); }, 0); }
  function hasDemo() {
    return ['clients', 'sessions', 'studio', 'members', 'subs', 'groups'].some(function (c) { return Object.keys(S[c]).some(function (k) { return S[c][k] && S[c][k].demo; }); });
  }

  /* ---------- общие куски разметки ---------- */
  function yearOptions() {
    var ys = {}; var cy = new Date().getFullYear();
    for (var y = cy - 2; y <= cy + 1; y++) ys[y] = 1;
    ys[S.year] = 1; ys[+S.month.slice(0, 4)] = 1;
    sessionList().forEach(function (s) { ys[+s.date.slice(0, 4)] = 1; });
    studioList().forEach(function (s) { ys[+s.date.slice(0, 4)] = 1; });
    return Object.keys(ys).map(Number).sort();
  }
  function monthNav() {
    var a = S.month.split('-').map(Number);
    return '<div class="monthnav"><button class="iconbtn" data-act="mprev" aria-label="Предыдущий месяц">‹</button>' +
      '<select data-bind="month" aria-label="Месяц">' + MONTHS.map(function (n, i) { return '<option value="' + (i + 1) + '"' + (i + 1 === a[1] ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
      '<select data-bind="year" aria-label="Год">' + yearOptions().map(function (y) { return '<option' + (y === a[0] ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<button class="iconbtn" data-act="mnext" aria-label="Следующий месяц">›</button></div>';
  }
  function yearNav() {
    return '<div class="monthnav"><button class="iconbtn" data-act="yprev" aria-label="Предыдущий год">‹</button>' +
      '<select data-bind="yearonly" aria-label="Год">' + yearOptions().map(function (y) { return '<option' + (y === S.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<button class="iconbtn" data-act="ynext" aria-label="Следующий год">›</button></div>';
  }
  function curBadge(c) { return '<span class="curbadge" title="' + esc(CURNAME[c] || '') + '">' + esc(c || '?') + '</span>'; }
  function emptyBox(title, text) { return '<div class="empty"><b>' + esc(title) + '</b>' + text + '</div>'; }

  /* ---------- Сводка ---------- */
  function viewSummary() {
    if (!hasAnyData()) return welcomeHTML();
    var m = S.month, weeks = daysInMonth(m) / 7;
    var ms = sessionList().filter(function (s) { return s.date.indexOf(m) === 0; });
    var agg = aggregate(ms);
    var st = studioList().filter(function (t) { return t.date.indexOf(m) === 0; });
    var sAcc = sum(st, studioTotal), sPaid = sum(st.filter(function (t) { return t.paid; }), studioTotal);
    var h = '<div class="grid four">';
    CUR.forEach(function (c) {
      var a = agg[c];
      h += '<section class="card' + (a.n ? '' : ' dim') + '"><div class="row"><div class="who">' + curBadge(c) + '<h3>Клиенты, ' + CURNAME[c].toLowerCase() + '</h3></div><span class="cnt">' + a.n + ' ' + plural(a.n, ['занятие', 'занятия', 'занятий']) + '</span></div>' +
        '<div class="big">' + (a.n ? money(a.sum, c) : '—') + '</div><div class="biglabel">начислено</div>' +
        '<dl class="kv"><div><dt>Оплачено</dt><dd>' + (a.n ? money(a.paid, c) : '—') + '</dd></div>' +
        '<div><dt>Не оплачено</dt><dd class="' + (a.sum - a.paid > 0 ? 'warn' : '') + '">' + (a.n ? money(a.sum - a.paid, c) : '—') + '</dd></div>' +
        '<div><dt>Средняя цена занятия</dt><dd>' + (a.n ? money(a.sum / a.n, c) : '—') + '</dd></div></dl></section>';
    });
    h += '<section class="card' + (st.length ? '' : ' dim') + '"><div class="row"><div class="who">' + curBadge('₸') + '<h3>Работа в студии</h3></div><span class="cnt">' + st.length + ' ' + plural(st.length, ['занятие', 'занятия', 'занятий']) + '</span></div>' +
      '<div class="big">' + (st.length ? money(sAcc, '₸') : '—') + '</div><div class="biglabel">заработано (всегда в тенге)</div>' +
      '<dl class="kv"><div><dt>Выплачено</dt><dd>' + (st.length ? money(sPaid, '₸') : '—') + '</dd></div>' +
      '<div><dt>Ждёт выплаты</dt><dd class="' + (sAcc - sPaid > 0 ? 'warn' : '') + '">' + (st.length ? money(sAcc - sPaid, '₸') : '—') + '</dd></div>' +
      '<div><dt>Средняя ставка за занятие</dt><dd>' + (st.length ? money(sAcc / st.length, '₸') : '—') + '</dd></div></dl></section>';
    h += '</div>';
    h += onlineCardHTML(m);

    var unpaidCount = ms.filter(function (s) { return !s.paid; }).length;
    if (unpaidCount) {
      h += '<div class="banner"><span><b>' + unpaidCount + '</b> ' + plural(unpaidCount, ['занятие', 'занятия', 'занятий']) + ' без оплаты в этом месяце.</span><button class="btn small" data-act="gounpaid">Показать в журнале</button></div>';
    }

    // по типам
    h += '<div class="sec"><h2>По типам занятий <small>начислено</small></h2><div class="tablewrap"><table><thead><tr><th>Тип</th>' +
      CUR.map(function (c) { return '<th class="num">' + c + '</th>'; }).join('') + '<th class="num">Занятий</th></tr></thead><tbody>';
    TYPES.forEach(function (t) {
      var l = ms.filter(function (s) { return s.type === t; }), a = aggregate(l);
      h += '<tr><td>' + t + '</td>' + CUR.map(function (c) { return '<td class="num">' + moneyDash(a[c].sum, c) + '</td>'; }).join('') + '<td class="num">' + units(l) + '</td></tr>';
    });
    h += '</tbody></table></div></div>';

    // по клиентам
    var hasGroup = ms.some(function (s) { return s.gsid; });
    var rows = clientList().map(function (c) {
      var l = ms.filter(function (s) { return s.clientId === c.id; });
      var r = l.filter(function (s) { return s.type === 'Реформер'; }).length;
      var acc = sumByCur(l, priceOf), paid = sumByCur(l.filter(function (s) { return s.paid; }), priceOf), debt = emptyCur();
      CUR.forEach(function (k) { debt[k] = acc[k] - paid[k]; });
      return { c: c, n: l.length, r: r, mt: l.length - r, acc: acc, paid: paid, debt: debt };
    }).filter(function (x) { return x.c.status !== 'Ушёл' || x.n > 0; });
    var tn = sum(rows, function (x) { return x.n; });
    h += '<div class="sec"><h2>По клиентам <small>суммы в валюте клиента' + (hasGroup ? ', занятия мини-групп считаются каждому пришедшему' : '') + '</small></h2>';
    if (!rows.length) { h += emptyBox('Клиентов пока нет', 'Добавьте первого клиента на вкладке «Клиенты».'); }
    else {
      h += '<div class="tablewrap"><table><thead><tr><th>Клиент</th><th class="num">Реформер</th><th class="num">Мат</th><th class="num">Всего</th><th class="num">В неделю</th><th class="num">Начислено</th><th class="num">Оплачено</th><th class="num">Не оплачено</th></tr></thead><tbody>';
      rows.forEach(function (x) {
        var hasDebt = CUR.some(function (k) { return x.debt[k] > 0; });
        h += '<tr><td>' + esc(x.c.name) + '</td><td class="num">' + x.r + '</td><td class="num">' + x.mt + '</td><td class="num">' + x.n + '</td><td class="num">' + numStr(x.n / weeks, 1) + '</td>' +
          '<td class="num">' + multiMoney(x.acc) + '</td><td class="num">' + multiMoney(x.paid) + '</td><td class="num ' + (hasDebt ? 'warn' : '') + '">' + multiMoney(x.debt) + '</td></tr>';
      });
      h += '<tr class="total"><td>' + (hasGroup ? 'Итого посещений' : 'Итого занятий') + '</td><td class="num">' + sum(rows, function (x) { return x.r; }) + '</td><td class="num">' + sum(rows, function (x) { return x.mt; }) + '</td><td class="num">' + tn + '</td><td class="num">' + numStr(tn / weeks, 1) + '</td><td colspan="3" class="muted">суммы смотрите по валютам выше</td></tr>';
      h += '</tbody></table></div>';
    }
    h += '</div>';
    return h;
  }

  /* ---------- Журнал ---------- */
  function viewJournal() {
    var l = sessionList().filter(function (s) { return s.date.indexOf(S.month) === 0; });
    if (S.fClient) l = l.filter(function (s) { return s.clientId === S.fClient; });
    if (S.onlyUnpaid) l = l.filter(function (s) { return !s.paid; });
    l.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); });
    if (!l.length) {
      return emptyBox('Занятий не найдено', S.onlyUnpaid || S.fClient ? 'Попробуйте снять фильтры.' : 'В этом месяце записей нет. Нажмите «+ Занятие», чтобы добавить первое.');
    }
    var agg = aggregate(l);
    var h = '<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Тип</th><th class="num">Цена</th><th>Оплата</th><th>Заметка</th><th></th></tr></thead><tbody>';
    l.forEach(function (s) {
      var c = S.clients[s.clientId], cu = curOf(s);
      var custom = s.price != null && s.price !== '' && !s.gsid;
      h += '<tr class="' + (s.paid ? '' : 'unpaid') + '"><td>' + fmtDay(s.date) + '</td><td>' + (c ? esc(c.name) : '<span class="bad">клиент удалён</span>') + (s.gsid ? '<div class="cell-sub">мини-группа: ' + esc(groupName(s.gid)) + '</div>' : '') + '</td><td>' + esc(s.type) + '</td>' +
        '<td class="num">' + money(priceOf(s), cu) + (custom ? ' <span class="cell-sub" title="Цена задана вручную">*</span>' : '') + '</td>' +
        '<td><button class="paidtoggle' + (s.paid ? ' on' : '') + '" data-act="togglepaid" data-id="' + esc(s.id) + '">' + (s.paid ? 'Оплачено' : 'Не оплачено') + '</button>' +
        (s.paid && s.paidDate ? ' <span class="cell-sub">' + fmtDate(s.paidDate) + '</span>' : '') + '</td>' +
        '<td>' + esc(s.note) + '</td><td><button class="btn small" data-act="editsession" data-id="' + esc(s.id) + '">Изменить</button></td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="muted" style="margin-top:10px">' + l.length + ' ' + plural(l.length, ['запись', 'записи', 'записей']) + ' · ' +
      CUR.filter(function (c) { return agg[c].n; }).map(function (c) { return money(agg[c].sum, c); }).join(' · ') + ' · * цена указана вручную</p>';
    return h;
  }

  /* ---------- Клиенты ---------- */
  function viewClients() {
    var now = todayStr(), nowN = dayNum(now);
    var l = clientList();
    if (S.fStatus === 'active') l = l.filter(function (c) { return c.status === 'Активный' || c.status === 'Пауза'; });
    if (!Object.keys(S.clients).length) return emptyBox('Клиентов пока нет', 'Нажмите «+ Клиент», выберите валюту и укажите цены за занятие.');
    if (!l.length) return emptyBox('Нет активных клиентов', 'Переключите фильтр на «Все».');
    var ss = sessionList();
    var h = '<div class="tablewrap"><table><thead><tr><th>Клиент</th><th>Направление</th><th class="num">Реформер</th><th class="num">Мат</th><th>Статус</th><th class="num">Занятий</th><th class="num">Доход всего</th><th class="num">Не оплачено</th><th>Последнее</th><th class="num">В неделю</th><th></th></tr></thead><tbody>';
    l.forEach(function (c) {
      var mine = ss.filter(function (s) { return s.clientId === c.id; });
      var acc = sumByCur(mine, priceOf), debt = sumByCur(mine.filter(function (s) { return !s.paid; }), priceOf), hasDebt = CUR.some(function (k) { return debt[k] > 0; });
      var last = mine.reduce(function (a, s) { return s.date > a ? s.date : a; }, '');
      var days = last ? nowN - dayNum(last) : null;
      var recent = mine.filter(function (s) { return nowN - dayNum(s.date) <= 27 && nowN - dayNum(s.date) >= 0; }).length;
      var stale = c.status === 'Активный' && days != null && days > 14;
      var stc = c.status === 'Активный' ? 'on' : c.status === 'Пауза' ? 'pause' : '';
      h += '<tr class="' + (c.status === 'Ушёл' ? 'gone' : '') + '"><td>' + esc(c.name) + (c.contact ? '<div class="cell-sub">' + esc(c.contact) + '</div>' : '') + '</td>' +
        '<td>' + esc(c.direction) + '</td><td class="num">' + (c.priceR ? money(c.priceR, c.currency) : '<span class="muted">—</span>') + '</td><td class="num">' + (c.priceM ? money(c.priceM, c.currency) : '<span class="muted">—</span>') + '</td>' +
        '<td><span class="pill ' + stc + '">' + esc(c.status) + '</span></td><td class="num">' + mine.length + '</td><td class="num">' + multiMoney(acc) + '</td>' +
        '<td class="num ' + (hasDebt ? 'warn' : '') + '">' + multiMoney(debt) + '</td>' +
        '<td>' + (last ? fmtDate(last) + '<div class="cell-sub ' + (stale ? 'warn' : '') + '">' + (days === 0 ? 'сегодня' : days + ' ' + plural(days, ['день', 'дня', 'дней']) + ' назад') + '</div>' : '<span class="muted">—</span>') + '</td>' +
        '<td class="num">' + numStr(recent / 4, 1) + '</td><td><button class="btn small" data-act="editclient" data-id="' + esc(c.id) + '">Изменить</button></td></tr>';
    });
    h += '</tbody></table></div><p class="muted" style="margin-top:10px">«В неделю» — среднее за последние 4 недели. Оранжевая подпись у даты — активный клиент не занимался больше 14 дней.</p>';
    return h;
  }

  /* ---------- Студия ---------- */
  function scaleHTML(s) {
    var cap = Math.max(1, Number(s.cap) || 1), out = [];
    for (var n = 1; n <= 6; n++) {
      var r = (Number(s.base) || 0) + (Number(s.step) || 0) * (Math.min(n, cap) - 1);
      out.push('<span>' + n + ' <b>→ ' + money(r, '₸') + '</b></span>');
    }
    return '<div class="scale">' + out.join('') + '</div>';
  }
  function ratesHTML() {
    if (!S.rd) S.rd = S.studios.map(function (x) { return Object.assign({}, x); });
    var h = '<div class="sec"><h2>Условия оплаты студий <small>ставка за занятие зависит от числа участников</small></h2><div class="card"><div class="rates">';

    S.rd.forEach(function (r, i) {
      h += '<div class="rate"><label class="form-l">Студия<input type="text" data-rate="' + i + ':name" value="' + esc(r.name) + '"></label>' +

        '<label class="form-l">За каждого следующего, ₸<input type="number" min="0" step="any" data-rate="' + i + ':step" value="' + esc(r.step) + '"></label>' +
        '<label class="form-l">Растёт до, чел.<input type="number" min="1" max="6" step="1" data-rate="' + i + ':cap" value="' + esc(r.cap) + '"></label>' +
        '<div><button class="btn danger small" data-act="delrate" data-id="' + i + '">Убрать</button></div>' + scaleHTML(r) + '</div>';
    });
    h += '<div class="actions"><button class="btn" data-act="addrate">+ Студия</button><button class="btn primary" data-act="saverates">Сохранить условия</button></div></div></div>' +
      '<p class="muted" style="margin-top:8px">Ставка записывается в занятие при сохранении, поэтому смена условий не меняет прошлые занятия.</p></div>';
    return h;
  }
  function viewStudio() {
    var l = studioList().filter(function (t) { return t.date.indexOf(S.month) === 0; });
    l.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); });
    var acc = sum(l, studioTotal), paid = sum(l.filter(function (t) { return t.paid; }), studioTotal);
    var h = '<div class="grid">' +
      '<section class="card"><div class="biglabel" style="margin:0 0 6px">Заработано за месяц</div><div class="big">' + money(acc, '₸') + '</div></section>' +
      '<section class="card"><div class="biglabel" style="margin:0 0 6px">Выплачено</div><div class="big">' + money(paid, '₸') + '</div></section>' +
      '<section class="card"><div class="biglabel" style="margin:0 0 6px">Ждёт выплаты</div><div class="big ' + (acc - paid > 0 ? 'warn' : '') + '">' + money(acc - paid, '₸') + '</div></section></div>';
    if (!l.length) {
      h += emptyBox('В этом месяце занятий в студии нет', 'Нажмите «+ Занятие в студии». Ставка посчитается по условиям ниже.');
    } else {
      h += '<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Студия</th><th>Тип</th><th class="num">Участников</th><th class="num">Ставка</th><th class="num">Корректировка</th><th class="num">Итого</th><th>Выплата</th><th>Заметка</th><th></th></tr></thead><tbody>';

      return true;
    });
    var rank = { soon: 0, expired: 1, active: 2, upcoming: 3, none: 4 };
    l.sort(function (a, b) {
      var ra = rank[a.st.kind], rb = rank[b.st.kind]; if (ra !== rb) return ra - rb;
      if (a.st.kind === 'expired') return a.st.end < b.st.end ? 1 : a.st.end > b.st.end ? -1 : 0;
      if (a.st.kind === 'soon' || a.st.kind === 'active') return a.st.left - b.st.left;
      return String(a.m.name).localeCompare(String(b.m.name), 'ru');
    });
    if (!l.length) return emptyBox('Никого не найдено', f === 'attn' ? 'Нет тех, у кого абонемент заканчивается или закончился.' : 'Попробуйте другой фильтр.');
    var h = '<div class="tablewrap"><table style="min-width:860px"><thead><tr><th>Участник</th><th>Доступ</th><th>Абонемент</th><th>Оплата</th><th class="num">Оплачено всего</th><th></th></tr></thead><tbody>';
    l.forEach(function (r) {
      var m = r.m, st = r.st, cu = m.currency, cur = st.cur || st.last;
      var paidSum = sum(r.subs.filter(function (a) { return !a.free && a.paid; }), function (a) { return Number(a.price) || 0; });
      var unpSum = sum(r.unp, function (a) { return Number(a.price) || 0; });
      var cls = st.kind === 'expired' ? 'exp' : st.kind === 'soon' ? 'soonrow' : r.unp.length ? 'unpaid' : '';
      var pay = [];
      if (r.unp.length) pay.push('<button class="paidtoggle" data-act="payunpaid" data-id="' + esc(m.id) + '" title="Нажмите, чтобы отметить оплаченным">Ещё не оплатил · ' + money(unpSum, cu) + '</button>');
      if (st.free) pay.push('<span class="pill free">Бесплатно' + (st.kind === 'expired' ? '' : ' до ' + fmtDate(st.end)) + '</span>');
      else if (!r.unp.length && r.subs.length) pay.push('<span class="pill on">Оплачено</span>');
      h += '<tr class="' + cls + '"><td>' + esc(m.name) + (m.contact ? '<div class="cell-sub">' + esc(m.contact) + '</div>' : '') + (m.note ? '<div class="cell-sub">' + esc(m.note) + '</div>' : '') + '</td>' +
        '<td>' + stateHTML(st) + '</td>' +
        '<td>' + (cur ? esc(planName(cur.plan)) + '<div class="cell-sub">' + fmtDate(cur.start) + ' – ' + fmtDate(cur.end) + (cur.free ? '' : ' · ' + money(cur.price, cu)) + '</div>' : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (pay.length ? pay.join('<div style="height:4px"></div>') : '<span class="muted">—</span>') + '</td>' +
        '<td class="num">' + moneyDash(paidSum, cu) + '<div class="cell-sub">' + r.subs.length + ' ' + plural(r.subs.length, ['абонемент', 'абонемента', 'абонементов']) + '</div></td>' +
        '<td><button class="btn small primary" data-act="renew" data-id="' + esc(m.id) + '">Продлить</button> <button class="btn small" data-act="editmember" data-id="' + esc(m.id) + '">Карточка</button></td></tr>';
    });
    h += '</tbody></table></div><p class="muted" style="margin-top:10px">«Заканчивается» — осталось ' + SOON_DAYS + ' дня и меньше. Подряд идущие абонементы считаются одним сроком. Тех, кто ушёл, переведите в статус «Ушёл» в карточке: они пропадут из списка и напоминаний.</p>';
    return h;
  }

  /* ---------- мини-группы ---------- */
  function groupList() {
    return Object.keys(S.groups).map(function (id) { return Object.assign({ id: id }, S.groups[id]); })
      .sort(function (a, b) { return (a.archived ? 1 : 0) - (b.archived ? 1 : 0) || String(a.name).localeCompare(String(b.name), 'ru'); });
  }
  function groupName(gid) { var g = S.groups[gid]; return g ? g.name : 'группа удалена'; }
  function priceParts(o) {
    var p = [];
    if (Number(o.priceR)) p.push('Реформер ' + money(o.priceR, o.cur));
    if (Number(o.priceM)) p.push('Мат ' + money(o.priceM, o.cur));
    return p.length ? p.join(' · ') : '—';
  }
  function viewGroups() {
    var gl = groupList();
    if (!gl.length) return emptyBox('Мини-групп пока нет', 'Мини-группа — это 2–4 клиента, которые занимаются вместе. Цена занятия либо делится поровну между пришедшими, либо у каждого своя фиксированная цена. Нажмите «+ Группа».');
    var ss = sessionList();
    var h = '<div class="tablewrap"><table style="min-width:760px"><thead><tr><th>Группа</th><th>Участники</th><th>Цена</th><th class="num">Занятий</th><th>Последнее</th><th></th></tr></thead><tbody>';
    gl.forEach(function (g) {
      var seen = {}, last = '';
      ss.forEach(function (s) { if (s.gid === g.id) { seen[s.gsid || s.id] = 1; if (s.date > last) last = s.date; } });
      var cnt = Object.keys(seen).length;
      var names = (g.members || []).map(function (x) { var c = S.clients[x.clientId]; return c ? esc(c.name) : '<span class="bad">клиент удалён</span>'; }).join(', ');
      var price;
      if (g.fixed) {
        price = '<div class="cell-sub">Фиксированная цена на человека</div>' + (g.members || []).map(function (x) { var c = S.clients[x.clientId]; return '<div>' + esc(c ? c.name : '?') + ': ' + priceParts(x) + '</div>'; }).join('');
      } else {
        price = '<div class="cell-sub">Цена группы, делится поровну</div><div>' + priceParts(g) + '</div>';
      }
      h += '<tr class="' + (g.archived ? 'gone' : '') + '"><td><b>' + esc(g.name) + '</b>' + (g.archived ? '<div><span class="pill">В архиве</span></div>' : '') + (g.note ? '<div class="cell-sub">' + esc(g.note) + '</div>' : '') + '</td>' +
        '<td>' + names + '</td><td>' + price + '</td><td class="num">' + cnt + '</td><td>' + (last ? fmtDate(last) : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (g.archived ? '' : '<button class="btn small primary" data-act="addgsession" data-id="' + esc(g.id) + '">Занятие</button> ') + '<button class="btn small" data-act="editgroup" data-id="' + esc(g.id) + '">Изменить</button></td></tr>';
    });
    return h + '</tbody></table></div><p class="muted" style="margin-top:10px">Занятие группы записывается в общий журнал отдельной строкой на каждого пришедшего: у каждого своя оплата. В сводке занятие группы считается один раз. Кто не пришёл, тот в этот раз не платит.</p>';
  }

  /* ---------- общий рендер ---------- */
  function render() {

    mode.className = 'modebadge';

    $('#tabs').innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" data-act="tab" data-id="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('');

    var banner = '';

      if (parts.length) banner += '<div class="banner"><span>Онлайн-группа: ' + parts.join(', ') + '.</span><button class="btn small" data-act="goonline">Показать</button></div>';
    }
    $('#banner').innerHTML = banner;

    var tb = '';
    var fc = '<select data-bind="fclient" aria-label="Клиент"><option value="">Все клиенты</option>' + clientList().map(function (c) { return '<option value="' + esc(c.id) + '"' + (S.fClient === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>';

    else if (S.tab === 'clients') tb = '<div class="chips"><button class="chip" data-act="fstatus" data-id="active" aria-pressed="' + (S.fStatus === 'active') + '">Активные</button><button class="chip" data-act="fstatus" data-id="all" aria-pressed="' + (S.fStatus === 'all') + '">Все</button></div><span class="spacer"></span><button class="btn primary" data-act="addclient">+ Клиент</button>';
    else if (S.tab === 'studio') tb = monthNav() + '<span class="spacer"></span><button class="btn primary" data-act="addstudio">+ Занятие в студии</button>';
    else if (S.tab === 'groups') tb = '<span class="spacer"></span><button class="btn" data-act="addgroup">+ Группа</button><button class="btn primary" data-act="addgsession">+ Занятие группы</button>';

    var scrollers = Array.prototype.map.call(view.querySelectorAll('.tablewrap'), function (n) { return n.scrollLeft; });
    var focusRate = (document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-rate')) || null;
    view.innerHTML = S.tab === 'summary' ? viewSummary() : S.tab === 'journal' ? viewJournal() : S.tab === 'clients' ? viewClients() : S.tab === 'groups' ? viewGroups() : S.tab === 'studio' ? viewStudio() : S.tab === 'online' ? viewOnline() : S.tab === 'backup' ? viewBackup() : viewMonths();
    Array.prototype.forEach.call(view.querySelectorAll('.tablewrap'), function (n, i) { if (scrollers[i]) n.scrollLeft = scrollers[i]; });
    if (focusRate) { var f = view.querySelector('[data-rate="' + focusRate + '"]'); if (f) f.focus(); }
  }

  /* ---------- модальные формы ---------- */
  function openModal(html, onMount) {
    var el = $('#modal');
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    el.hidden = false; document.body.classList.add('noscroll');
    if (onMount) onMount(el);
    var f = el.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea'); if (f) f.focus();
  }
  function closeModal() { var el = $('#modal'); el.hidden = true; el.innerHTML = ''; el.removeAttribute('data-member'); document.body.classList.remove('noscroll'); }
  function armDelete(btn, run) {
    btn.addEventListener('click', function () {
      if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Точно удалить?'; setTimeout(function () { btn.classList.remove('armed'); btn.textContent = 'Удалить'; }, 4000); return; }
      run();
    });
  }
  function defaultDate() { var t = todayStr(); return t.indexOf(S.month) === 0 ? t : S.month + '-01'; }
  function setErr(el, msg) { var e = el.querySelector('.errmsg'); if (e) e.textContent = msg || ''; }

  function openSession(id) {

    var firstClient = ex ? ex.clientId : (S.fClient && S.clients[S.fClient] ? S.fClient : cl[0].id);
    var isG = !!(ex && ex.gsid);
    var d = ex || { date: defaultDate(), clientId: firstClient, type: S.clients[firstClient].direction === 'Мат' ? 'Мат' : 'Реформер', price: null, paid: false, paidDate: '', note: '' };
    var html = '<h2>' + (ex ? 'Занятие' : 'Новое занятие') + '</h2>' + (isG ? '<div class="pricebox" style="margin-bottom:12px">Занятие мини-группы «' + esc(groupName(ex.gid)) + '». Здесь меняется только эта строка: оплата, цена и заметка. Состав и цену всего занятия можно поменять кнопкой ниже.<div style="margin-top:8px"><button type="button" class="btn small" data-act="editgsession" data-id="' + esc(ex.gsid) + '">Изменить всё занятие группы</button></div></div>' : '') + '<form class="form" id="f" novalidate>' +
      '<div class="two"><label>Дата<input type="date" name="date" value="' + esc(d.date) + '" required></label>' +

      '<label>Клиент<select name="clientId"' + (isG ? ' disabled' : '') + '>' + cl.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === d.clientId ? ' selected' : '') + '>' + esc(c.name) + ' (' + esc(c.currency) + ')</option>'; }).join('') + '</select></label>' +
      '<div class="pricebox" id="pricebox"></div>' +
      '<label>' + (isG ? 'Цена этой строки' : 'Другая цена, если не по карточке <span class="hint">скидка, пробное, разовая цена</span>') + '<span class="withunit"><input type="number" name="price" min="0" step="any" inputmode="decimal" value="' + (d.price != null && d.price !== '' ? esc(d.price) : '') + '"><span id="unit"></span></span></label>' +

      '<div class="actions">' + (ex ? '<button type="button" class="btn danger left" id="del">Удалить</button>' : '') + '<button type="button" class="btn" data-act="close">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form>';
    openModal(html, function (el) {
      var f = el.querySelector('#f');
      function upd() {
        var c = S.clients[f.clientId.value], t = f.type.value;
        var base = c ? (t === 'Мат' ? c.priceM : c.priceR) : null;
        el.querySelector('#unit').textContent = isG ? curOf(ex) : (c ? c.currency : '');

      f.type.addEventListener('change', upd);

          if (f.date.value !== ex.date) sessionList().forEach(function (s) { if (s.gsid === ex.gsid && s.id !== id) jobs.push(['put', s.id, Object.assign({}, S.sessions[s.id], { date: f.date.value })]); });

    openModal(html, function (el) {

  function wireSub(el, f, getCur, subs, priceTouched) {

    function sync() {
      var free = pay() === 'free';

      el.querySelector('#boughtl').textContent = free ? 'Дата выдачи' : 'Дата покупки';
      el.querySelector('#unit').textContent = getCur();

    function recalc() { var p = plan(); if (p !== 'custom' && f.start.value) f.end.value = planEnd(f.start.value, p); }
    Array.prototype.forEach.call(f.querySelectorAll('input[name=plan]'), function (r) {
      r.addEventListener('change', function () {

    f.end.addEventListener('change', function () { var p = plan(); if (p !== 'custom' && f.end.value !== planEnd(f.start.value, p)) setPlan('custom'); });
    f.price.addEventListener('input', function () { priceTouched = true; });
    Array.prototype.forEach.call(f.querySelectorAll('input[name=pay]'), function (r) { r.addEventListener('change', sync); });
    sync();
    return {
      sync: sync,
      read: function () {
        var p = plan(), pv = pay(), free = pv === 'free';
        if (!f.start.value) return { err: 'Укажите дату начала.' };
        if (!f.end.value) return { err: 'Укажите дату окончания.' };
        if (f.end.value < f.start.value) return { err: 'Дата окончания раньше даты начала.' };
        var price = free ? 0 : num(f.price.value);
        if (!free && !(price > 0)) return { err: 'Укажите цену или выберите «Бесплатно».' };
        var bought = f.bought.value || todayStr();
        return { data: { plan: p, free: free, start: f.start.value, end: f.end.value, bought: bought, price: price, paid: free ? true : pv === 'paid', paidDate: (!free && pv === 'paid') ? bought : '', note: f.subnote.value.trim() } };

  function subDefaultsNew() { var t = todayStr(); return { plan: 'month', start: t, end: planEnd(t, 'month'), pay: 'paid', price: '', bought: t, note: '' }; }

  /* ---------- формы: мини-группы ---------- */

      row = rr[r] || []; var sn = vText(row[rm['студия']]); if (!sn) continue;
      out.studios.push({ name: sn, base: vNum(row[rm['за 1 участника']]) || 0, step: vNum(row[rm['плюс за каждого следующего']]) || 0, cap: Math.max(1, Math.min(6, Math.round(vNum(row[rm['растет до чел']]) || 4))) });
    }
    var tt = book['Студия'] || [], tm = colMap(tt[0]);
    for (r = 1; r < tt.length; r++) {
      row = tt[r] || [];
      var td = vDate(row[tm['дата']]), tn = Math.round(vNum(row[tm['участников']]) || 0), tname = vText(row[tm['студия']]), ttype = vOne(row[tm['тип']], TYPES, '');
      if (!td && !tname) continue;
      if (!td || !tname || !ttype || tn < 1 || tn > 6) { out.skipped++; continue; }
      var rate = vNum(row[tm['ставка']]);
      if (rate == null) { var cfg = out.studios.filter(function (z) { return z.name === tname; })[0]; rate = cfg ? cfg.base + cfg.step * (Math.min(tn, cfg.cap) - 1) : 0; }
      out.studio['t' + out.stamp + (n++)] = { date: td, studio: tname, type: ttype, n: tn, rate: rate, adjust: vNum(row[tm['корректировка']]) || 0, paid: vBool(row[tm['выплачено']]), note: vText(row[tm['заметка']]) };
    }
    return out;
  }
  function importFile(f) {
    f.arrayBuffer().then(unzip).then(readBook).then(parseBackup).then(function (p) { confirmImport(p, f.name); }).catch(function (e) {
      toast(e && e.message === 'nodecomp' ? 'Этот браузер не умеет читать такие файлы Excel. Обновите систему или загрузите файл, выгруженный из этого приложения.' : 'Не удалось прочитать файл. Нужен файл .xlsx, который выгрузило это приложение.', 'bad');
    });
  }
  function confirmImport(p, fname) {
    var cnt = function (o) { return Object.keys(o).length; };
    var html = '<h2>Загрузить копию?</h2><p style="margin:0 0 8px">Файл «' + esc(fname) + '»: клиентов — <b>' + cnt(p.clients) + '</b>, занятий — <b>' + cnt(p.sessions) + '</b>, занятий в студии — <b>' + cnt(p.studio) + '</b>, мини-групп — <b>' + cnt(p.groups) + '</b>, участников онлайн-группы — <b>' + cnt(p.members) + '</b>, абонементов — <b>' + cnt(p.subs) + '</b>.</p>' +
      '<p style="margin:0 0 8px">Сейчас в приложении: клиентов — ' + cnt(S.clients) + ', занятий — ' + cnt(S.sessions) + ', в студии — ' + cnt(S.studio) + ', мини-групп — ' + cnt(S.groups) + ', участников онлайн-группы — ' + cnt(S.members) + ', абонементов — ' + cnt(S.subs) + '. Эти данные будут <b>заменены</b> данными из файла.</p>' +
      (p.skipped ? '<p class="warn" style="margin:0 0 8px">Пропущено строк с ошибками: ' + p.skipped + ' (нет клиента, даты или типа занятия).</p>' : '') +
      '<div class="actions"><button type="button" class="btn left" data-act="export">Сначала выгрузить текущие данные</button><button type="button" class="btn" data-act="close">Отмена</button><button type="button" class="btn primary" id="doimport">Заменить данные</button></div>';
    openModal(html, function (el) {
      el.querySelector('#doimport').addEventListener('click', function () {
        S.clients = p.clients; S.sessions = p.sessions; S.studio = p.studio; S.members = p.members; S.subs = p.subs; S.groups = p.groups; if (p.studios.length || !S.studios.length) S.studios = p.studios; S.rd = null;
        saveLocal(); closeModal(); render(); toast('Данные загружены из файла');
      });
    });
  }

  /* ---------- пробные данные, пустой старт, стирание ---------- */
  function hasAnyData() { return ['clients', 'sessions', 'studio', 'members', 'subs', 'groups'].some(function (c) { return Object.keys(S[c]).length; }); }
  function hasReal() { return ['clients', 'sessions', 'studio', 'members', 'subs', 'groups'].some(function (c) { return Object.keys(S[c]).some(function (k) { return !S[c][k].demo; }); }); }
  function needBackup() { return hasReal() && (!lastBackup || dayNum(todayStr()) - dayNum(lastBackup) > 14); }
  function ago(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function seedDemo() {
    var cl = [['c1', 'Айгерим', '@aigerim', 'Оба', '₸', 8000, 5000, 'Ходит 2 раза в неделю'], ['c2', 'Мария', '+7 700 000 00 01', 'Реформер', '₸', 9000, null, ''],
      ['c3', 'Динара', '@dinara', 'Мат', '₽', null, 1800, 'Нерегулярно'], ['c4', 'Елена', '@elena', 'Оба', '$', 15, 10, ''], ['c5', 'Асель', '@asel', 'Реформер', '₸', 8000, null, 'Давно не была']];
    cl.forEach(function (x) { S.clients['demo-' + x[0]] = { name: x[1], contact: x[2], direction: x[3], currency: x[4], priceR: x[5], priceM: x[6], status: 'Активный', start: ago(45), notes: x[7], demo: true }; });
    var se = [['c1', 'Реформер', 28, 1], ['c2', 'Реформер', 27, 1], ['c3', 'Мат', 26, 1], ['c4', 'Мат', 25, 1], ['c1', 'Мат', 21, 1], ['c2', 'Реформер', 20, 1], ['c4', 'Реформер', 18, 1], ['c5', 'Реформер', 17, 1],
      ['c1', 'Реформер', 14, 1], ['c2', 'Реформер', 13, 1], ['c3', 'Мат', 11, 1], ['c1', 'Реформер', 8, 1], ['c2', 'Реформер', 7, 1], ['c3', 'Мат', 5, 0], ['c4', 'Мат', 4, 0], ['c1', 'Мат', 3, 1], ['c2', 'Реформер', 1, 0]];
    se.forEach(function (x, i) { S.sessions['demo-s' + i] = { date: ago(x[2]), clientId: 'demo-' + x[0], type: x[1], price: null, paid: !!x[3], paidDate: x[3] ? ago(x[2]) : '', note: '', demo: true }; });
    if (!S.studios.length) S.studios = [{ name: 'Моя студия', base: 5500, step: 1000, cap: 4 }];
    var ts = [[15, 'Мат', 6, 1], [13, 'Реформер', 4, 1], [9, 'Реформер', 2, 1], [6, 'Мат', 5, 1], [3, 'Реформер', 1, 1], [1, 'Реформер', 3, 0]];
    ts.forEach(function (x, i) { S.studio['demo-t' + i] = { date: ago(x[0]), studio: S.studios[0].name, type: x[1], n: x[2], rate: rateFor(S.studios[0].name, x[2]), adjust: 0, paid: !!x[3], note: '', demo: true }; });
    // онлайн-группа
    var mem = [['m1', 'Алия', '@aliya', '₸', 'month', 10, 'paid', 8000], ['m2', 'Дарья', '@darya', '₽', 'week', 6, 'paid', 1500], ['m3', 'Камила', '@kamila', '₸', 'month', 33, 'paid', 8000],
      ['m4', 'Игорь', '@igor', '$', 'month', 10, 'free', 0], ['m5', 'Лаура', '@laura', '₸', 'quarter', 5, 'unpaid', 20000], ['m6', 'Томирис', '@tomiris', '₸', 'week', 5, 'paid', 2500]];
    mem.forEach(function (x, i) {
      S.members['demo-' + x[0]] = { name: x[1], contact: x[2], currency: x[3], status: 'Активный', note: x[4] === 'quarter' ? 'Купила на 3 месяца, оплата позже' : '', demo: true };
      var st = ago(x[5]), fr = x[6] === 'free';
      S.subs['demo-a' + i] = { memberId: 'demo-' + x[0], plan: x[4], free: fr, start: st, end: planEnd(st, x[4]), bought: st, price: x[7], paid: x[6] !== 'unpaid', paidDate: x[6] === 'paid' ? st : '', note: fr ? 'Пробный доступ' : '', demo: true };
    });
    S.subs['demo-a-old'] = { memberId: 'demo-m3', plan: 'month', free: false, start: ago(63), end: planEnd(ago(63), 'month'), bought: ago(63), price: 8000, paid: true, paidDate: ago(63), note: '', demo: true };
    // мини-группы
    S.groups['demo-g1'] = { name: 'Группа утро', fixed: false, cur: '₸', priceR: 12000, priceM: 8000, members: [{ clientId: 'demo-c1' }, { clientId: 'demo-c2' }, { clientId: 'demo-c5' }], archived: false, note: 'Цена делится поровну', demo: true };
    S.groups['demo-g2'] = { name: 'Пара', fixed: true, cur: '', priceR: null, priceM: null, members: [{ clientId: 'demo-c3', cur: '₽', priceR: null, priceM: 1200 }, { clientId: 'demo-c4', cur: '$', priceR: null, priceM: 8 }], archived: false, note: 'У каждого своя цена и валюта', demo: true };
    [['demo-g1', 'Реформер', 12, ['demo-c1', 'demo-c2', 'demo-c5'], ['demo-c1', 'demo-c2']], ['demo-g1', 'Реформер', 5, ['demo-c1', 'demo-c2'], []], ['demo-g2', 'Мат', 9, ['demo-c3', 'demo-c4'], ['demo-c3']]].forEach(function (x, i) {
      var g = S.groups[x[0]], sh = gShares(g, x[1], x[3], {});
      x[3].forEach(function (cid, k) {
        var paid = x[4].indexOf(cid) >= 0;
        S.sessions['demo-gs' + i + '-' + k] = { date: ago(x[2]), clientId: cid, type: x[1], price: sh[cid].price, cur: sh[cid].cur, gid: x[0], gsid: 'demo-gsid' + i, paid: paid, paidDate: paid ? ago(x[2]) : '', note: '', demo: true };
      });
    });
    S.month = todayStr().slice(0, 7); saveLocal(); render();
  }
  function welcomeHTML() {
    return '<div class="empty" style="padding:44px 22px"><b style="font-size:22px">Здесь пока пусто</b>Начните с клиента: укажите его валюту и цену за занятие. Дальше занятия записываются в пару нажатий. Онлайн-группа с абонементами и мини-группы находятся на своих вкладках.' +
      '<div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" data-act="startclient">+ Добавить клиента</button><button class="btn" data-act="seed">Посмотреть на примерах</button><button class="btn" data-act="import">Загрузить копию из Excel</button></div></div>';
  }
  function viewBackup() {
    var cnt = function (o) { return Object.keys(o).length; };
    var last = lastBackup ? fmtDate(lastBackup) + ' (' + (dayNum(todayStr()) - dayNum(lastBackup)) + ' ' + plural(dayNum(todayStr()) - dayNum(lastBackup), ['день', 'дня', 'дней']) + ' назад)' : 'ещё не делали';
    return '<div class="grid two">' +
      '<section class="card"><div class="row"><h3>Сохранить копию</h3></div><p style="margin:0 0 12px">В файл Excel попадут клиенты, журнал занятий, мини-группы, занятия в студии, условия оплаты и онлайн-группа (участники и абонементы). Последняя копия: <b>' + last + '</b>.</p>' +
      '<dl class="kv" style="margin-bottom:14px"><div><dt>Клиентов</dt><dd>' + cnt(S.clients) + '</dd></div><div><dt>Занятий</dt><dd>' + cnt(S.sessions) + '</dd></div><div><dt>Занятий в студии</dt><dd>' + cnt(S.studio) + '</dd></div><div><dt>Мини-групп</dt><dd>' + cnt(S.groups) + '</dd></div><div><dt>Участников онлайн-группы</dt><dd>' + cnt(S.members) + '</dd></div><div><dt>Абонементов</dt><dd>' + cnt(S.subs) + '</dd></div></dl>' +
      '<button class="btn primary" data-act="export">Выгрузить в Excel</button></section>' +
      '<section class="card"><div class="row"><h3>Восстановить из копии</h3></div><p style="margin:0 0 14px">Выберите файл .xlsx, который выгрузило это приложение. Данные в приложении будут заменены данными из файла. Файл можно править в Excel, колонки менять не нужно.</p>' +
      '<button class="btn" data-act="import">Загрузить из Excel</button></section></div>' +
      '<div class="sec" style="margin-top:6px"><h2>Как хранятся данные</h2><div class="card"><p style="margin:0 0 10px">Записи лежат только на этом устройстве, в памяти браузера. В интернет они не отправляются и на другие устройства не попадают.</p>' +
      '<p style="margin:0 0 10px"><b>Сохраняйте копию раз в одну-две недели</b> и не стирайте данные сайтов в настройках Safari: вместе с ними пропадут и записи.</p>' +
      '<p style="margin:0">На iPhone откройте адрес приложения в Safari, нажмите «Поделиться» и «На экран “Домой”». Вводите данные уже в приложении с иконки: у иконки и у Safari память раздельная, записи из одной не видны в другой. Если вводили данные в Safari, выгрузите копию там и загрузите её в приложении с иконки.</p></div></div>' +
      '<div class="sec"><h2>Стереть все данные</h2><div class="card"><p style="margin:0 0 12px">Удалит всех клиентов, занятия, мини-группы, абонементы и условия студий на этом устройстве. Сначала сделайте копию.</p><button class="btn danger" data-act="wipe">Стереть всё…</button></div></div>';
  }
  function openWipe() {
    openModal('<h2>Стереть все данные?</h2><p style="margin:0 0 8px">Будут удалены все клиенты, занятия, мини-группы, абонементы и условия студий на этом устройстве. Это нельзя отменить, если нет копии в Excel.</p>' +
      '<div class="actions"><button type="button" class="btn left" data-act="export">Сначала выгрузить копию</button><button type="button" class="btn" data-act="close">Отмена</button><button type="button" class="btn danger" id="dowipe">Стереть всё</button></div>', function (el) {
      var b = el.querySelector('#dowipe');
      b.addEventListener('click', function () {
        if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Точно стереть?'; return; }
        S.clients = {}; S.sessions = {}; S.studio = {}; S.studios = []; S.members = {}; S.subs = {}; S.groups = {}; S.rd = null; saveLocal(); closeModal(); S.tab = 'summary'; render(); toast('Все данные стёрты');
      });
    });
  }

  $('#impfile').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) importFile(f); });
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { } }); }

  render();
  initData();
})();
</script>
</body>
